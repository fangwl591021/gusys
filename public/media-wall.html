    .store-preview-icon{display:grid;width:58px;height:58px;margin:0 auto 12px;place-items:center;border-radius:50%;background:var(--accent);font-size:24px}
    .store-preview strong{display:block;font-size:17px;line-height:1.4}
    .store-preview span{display:block;margin-top:6px;color:#c7d1cd;font-size:12px;line-height:1.5}
    .store-video-frame{display:grid;max-height:70vh;place-items:center;overflow:hidden;background:#000}

    .store-video-error{width:100%;padding:42px 20px;color:#fff;text-align:center;line-height:1.6}
    .card{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:0 8px 22px rgba(31,52,44,.06)}
    .card.featured{border-top:4px solid var(--accent)}
    .card-body{padding:16px}
    .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:12px;line-height:1.4}
    .badge{display:inline-flex;padding:5px 8px;border-radius:5px;background:#e7f5ee;color:var(--accent-strong);font-weight:900}
    .title{margin:10px 0 7px;font-size:18px;font-weight:900;line-height:1.45;letter-spacing:0}
    .desc{margin:0;color:#5b696f;font-size:14px;line-height:1.68}
    .actions{display:flex;gap:9px;margin-top:14px}
    .btn{display:inline-flex;min-height:44px;flex:1;align-items:center;justify-content:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#35444b;font-size:13px;font-weight:900;text-align:center;text-decoration:none;cursor:pointer}

    .video{position:relative;display:grid;aspect-ratio:16/9;place-items:center;background:#101820;color:#fff}
    .video iframe{display:block;width:100%;height:100%;border:0}
    .video-load{display:flex;width:100%;height:100%;align-items:center;justify-content:center;gap:12px;border:0;background:#18252d;color:#fff;cursor:pointer}
    .play-icon{display:grid;width:52px;height:52px;place-items:center;border-radius:50%;background:var(--accent);font-size:21px;line-height:1}
    .video-load-text{display:grid;gap:3px;text-align:left}
    .video-load-text strong{font-size:15px}.video-load-text span{color:#bdc8c4;font-size:12px}
    .article{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;align-items:start}
    .logo{display:grid;width:46px;height:46px;place-items:center;border-radius:6px;background:var(--dark);color:#fff;font-size:12px;font-weight:900}
    .article .title{margin-top:2px;font-size:16px}.article .desc{font-size:13px}
    .article-actions{grid-column:2;margin-top:2px}.article-actions .btn{width:auto;min-width:132px;flex:0 0 auto;padding:9px 12px}
    .empty{padding:32px 18px;border:1px dashed var(--line);border-radius:8px;background:#fff;color:var(--muted);text-align:center}
    .notice{margin-top:22px;padding:15px;border:1px solid #d8dfdc;border-left:4px solid var(--warm);border-radius:6px;background:#fff;color:#65736f;font-size:12px;line-height:1.75}
    .footer{padding:22px 18px calc(24px + env(safe-area-inset-bottom));color:#78847f;font-size:12px;text-align:center}
    .hidden{display:none!important}
    @media(min-width:650px){.content{padding-right:20px;padding-left:20px}.filters{margin-right:-20px;margin-left:-20px;padding-right:20px;padding-left:20px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding-right:28px;padding-left:28px}}

  <script>

        title:"礁溪溫泉小旅行專題",
        description:"聯合新聞網旅遊報導整理礁溪特色行程，包含重口味溫泉魚的互動體驗。",
        sourceUrl:"https://travel.udn.com/travel/story/7210/8446413",sourceLabel:"查看原始報導"
      },

        sourceUrl:"https://www.nownews.com/news/6268298",sourceLabel:"查看原始報導"
      },

        sourceUrl:"https://www.walkerland.com.tw/article/view/297536",sourceLabel:"查看原始文章"
      },
      {
        id:"tabizine-442393",type:"article",categories:["travel","overseas"],media:"TABIZINE",logo:"JP",date:"2022-01-07",
        title:"日本旅遊媒體礁溪現地報導",
        description:"日本旅遊媒體以海外旅客視角走訪礁溪，介紹店內多種魚池與實際互動過程。",
        sourceUrl:"https://tabizine.jp/2022/01/07/442393/",sourceLabel:"查看原始報導"
      }
    ];

    const state={filter:"all",liffReady:false,storeVideos:[...FALLBACK_STORE_VIDEOS]};
    const storeSection=document.getElementById("storeSection");
    const storeVideoGrid=document.getElementById("storeVideoGrid");
    const videoGrid=document.getElementById("videoGrid");
    const articleGrid=document.getElementById("articleGrid");
    const emptyState=document.getElementById("emptyState");

    function escapeHtml(value){
      return String(value==null?"":value).replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[char]));
    }

    function validExternalUrl(value){
      try{const url=new URL(String(value||""));return url.protocol==="https:"?url.href:""}catch(_error){return ""}
    }

    function formatDate(value){return escapeHtml(String(value||"").replaceAll("-","."))}

    function actionMarkup(item,primary){
      const url=item.disabled?"":validExternalUrl(item.sourceUrl);
      if(!url)return '<span class="btn disabled" aria-disabled="true">原始連結待確認</span>';
      return '<a class="btn external'+(primary?' primary':'')+'" href="'+escapeHtml(url)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(item.sourceLabel||"查看原始內容")+'</a>';
    }

    function videoMarkup(item){
      const videoId=/^[A-Za-z0-9_-]{11}$/.test(item.youtubeId||"")?item.youtubeId:"";
      const values=[item.media,item.creator,item.date?String(item.date).replaceAll("-","."):""].filter(Boolean);
      const meta=values.map((value,index)=>index===0?'<span class="badge">'+escapeHtml(value)+'</span>':'<span>'+escapeHtml(value)+'</span>').join("");
      return '<article class="card media-item'+(item.featured?' featured':'')+'" data-id="'+escapeHtml(item.id)+'">'+
        '<div class="video" data-video-id="'+escapeHtml(videoId)+'" data-title="'+escapeHtml(item.title)+'">'+
          '<button class="video-load" type="button"'+(videoId?'':' disabled')+'><span class="play-icon" aria-hidden="true">▶</span><span class="video-load-text"><strong>播放影片</strong><span>YouTube 官方播放器</span></span></button>'+
        '</div><div class="card-body"><div class="meta">'+meta+'</div><div class="title">'+escapeHtml(item.title)+'</div><p class="desc">'+escapeHtml(item.description)+'</p><div class="actions">'+actionMarkup(item,item.featured)+'</div></div></article>';
    }

    function articleMarkup(item){
      const meta='<span class="badge">'+escapeHtml(item.media)+'</span>'+(item.date?'<span>'+formatDate(item.date)+'</span>':'');
      return '<article class="card card-body article media-item" data-id="'+escapeHtml(item.id)+'"><div class="logo" aria-hidden="true">'+escapeHtml(item.logo||"MEDIA")+'</div><div><div class="meta">'+meta+'</div><div class="title">'+escapeHtml(item.title)+'</div><p class="desc">'+escapeHtml(item.description)+'</p></div><div class="article-actions">'+actionMarkup(item,false)+'</div></article>';
    }

    function storeVideoMarkup(item){
      const url=validExternalUrl(item.sourceUrl);
      const posterUrl=validExternalUrl(item.posterUrl);
      const action=url?'<a class="btn external primary" href="'+escapeHtml(url)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(item.sourceLabel||"開啟店家影音")+'</a>':'<span class="btn disabled" aria-disabled="true">影片目前暫時無法播放</span>';
      const media=item.playbackMode==="html5"&&url?'<div class="store-video-frame"><video controls playsinline preload="metadata" src="'+escapeHtml(url)+'"'+(posterUrl?' poster="'+escapeHtml(posterUrl)+'"':'')+' aria-label="'+escapeHtml(item.title)+'"></video><div class="store-video-error hidden">影片目前暫時無法播放<br>請使用下方按鈕開啟原始影音。</div></div>':'<div class="store-preview"><div><span class="store-preview-icon" aria-hidden="true">▶</span><strong>店家現場影音</strong><span>此來源需於外部視窗開啟</span></div></div>';
      return '<article class="card store-card media-item" data-id="'+escapeHtml(item.id)+'">'+
        media+
        '<div class="card-body"><div class="meta"><span class="badge">'+escapeHtml(item.media||"官方影音")+'</span><span>店家自有內容</span></div><div class="title">'+escapeHtml(item.title)+'</div><p class="desc">'+escapeHtml(item.description)+'</p><div class="actions">'+action+'</div></div></article>';
    }

    function visibleItems(){return MEDIA_ITEMS.filter(item=>state.filter==="all"||item.categories.includes(state.filter))}
    function visibleStoreVideos(){return state.storeVideos.filter(item=>state.filter==="all"||item.categories.includes(state.filter))}

    function bindStoreVideoErrors(){
      storeVideoGrid.querySelectorAll("video").forEach(video=>video.addEventListener("error",()=>{
        video.classList.add("hidden");
        video.parentElement?.querySelector(".store-video-error")?.classList.remove("hidden");
      },{once:true}));
    }

    function render(){
      const storeVideos=visibleStoreVideos();
      const visible=visibleItems();
      const videos=visible.filter(item=>item.type==="video");
      const articles=visible.filter(item=>item.type==="article");
      storeVideoGrid.innerHTML=storeVideos.map(storeVideoMarkup).join("");
      bindStoreVideoErrors();
      videoGrid.innerHTML=videos.map(videoMarkup).join("");
      articleGrid.innerHTML=articles.map(articleMarkup).join("");
      document.getElementById("storeVideoCount").textContent=storeVideos.length?storeVideos.length+" 則":"";
      document.getElementById("videoCount").textContent=videos.length?videos.length+" 則":"";
      document.getElementById("articleCount").textContent=articles.length?articles.length+" 則":"";
      storeSection.classList.toggle("hidden",storeVideos.length===0);
      videoGrid.previousElementSibling.classList.toggle("hidden",videos.length===0);
      videoGrid.classList.toggle("hidden",videos.length===0);
      articleGrid.previousElementSibling.classList.toggle("hidden",articles.length===0);
      articleGrid.classList.toggle("hidden",articles.length===0);
      emptyState.classList.toggle("hidden",storeVideos.length+visible.length!==0);
    }

    async function loadStoreVideos(){
      try{
        const response=await fetch("/api/media-wall/store-videos",{headers:{accept:"application/json"},cache:"no-store"});
        if(!response.ok)throw new Error("HTTP "+response.status);
        const payload=await response.json();
        const rows=Array.isArray(payload?.data)?payload.data:[];
        state.storeVideos=rows.map(item=>({
          id:String(item.id||""),type:"store-video",categories:["store"],media:String(item.mediaLabel||"官方影音"),
          title:String(item.title||""),description:String(item.description||""),sourceUrl:String(item.sourceUrl||""),
          sourceLabel:String(item.sourceLabel||"開啟店家影音"),playbackMode:item.playbackMode==="html5"?"html5":"external",posterUrl:String(item.posterUrl||"")
        })).filter(item=>item.id&&item.title&&validExternalUrl(item.sourceUrl));
        render();
      }catch(error){console.warn("Store videos API unavailable; fallback retained",error)}
    }

    function loadVideo(container){
      const videoId=container.dataset.videoId||"";
      if(!/^[A-Za-z0-9_-]{11}$/.test(videoId))return;
      const iframe=document.createElement("iframe");
      iframe.loading="lazy";
      iframe.src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(videoId)+"?playsinline=1&rel=0";
      iframe.title=container.dataset.title||"YouTube 影片";
      iframe.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      iframe.allowFullscreen=true;
      container.replaceChildren(iframe);
    }

    function openExternal(targetUrl){
      const url=validExternalUrl(targetUrl);
      if(!url)return;
      try{
        if(state.liffReady&&window.liff&&liff.isInClient()){
          liff.openWindow({url,external:true});
          return;
        }
      }catch(error){console.warn("LIFF openWindow fallback",error)}
      const opened=window.open(url,"_blank","noopener,noreferrer");
      if(opened)opened.opener=null;
    }

    async function initLiff(){
      if(!window.liff)return;
      try{await liff.init({liffId:LIFF_ID});state.liffReady=true}catch(error){console.warn("LIFF init unavailable; external links remain usable",error)}
    }

    document.querySelector(".filters").addEventListener("click",event=>{
      const button=event.target.closest(".filter");
      if(!button)return;
      state.filter=button.dataset.filter||"all";
      document.querySelectorAll(".filter").forEach(item=>{
        const active=item===button;
        item.classList.toggle("active",active);
        item.setAttribute("aria-pressed",String(active));
      });
      render();
    });

    document.querySelector(".content").addEventListener("click",event=>{
      const playButton=event.target.closest(".video-load");
      if(playButton){loadVideo(playButton.closest(".video"));return}
      const external=event.target.closest("a.external");
      if(external){event.preventDefault();openExternal(external.href)}
    });

    render();
    loadStoreVideos();
    window.addEventListener("load",initLiff,{once:true});
  </script>
</body>
</html>
