<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>礁溪群島後台｜重口味溫泉魚</title><link rel="stylesheet" href="/jiaoxi-islands-admin.css?v=20261026-1"><script src="/jiaoxi-islands-admin.js?v=20261026-1" defer></script></head><body>
<header><div><span>重口味溫泉魚</span><h1>礁溪食宿遊購行群島後台</h1></div><div class="auth"><input id="token" type="password" placeholder="Admin token"><button id="saveToken">儲存</button><button id="reload" class="primary">更新</button></div></header>
<nav><button data-view="places" aria-selected="true">地點管理</button><button data-view="analytics">成效分析</button><a href="/jiaoxi-islands.html" target="_blank" rel="noopener noreferrer">開啟前台 ↗</a><a href="/admin">返回總後台</a></nav>
<main><section id="placesView"><div class="toolbar"><div><h2>上架地點</h2><p>管理分類、實景圖、排序與精準導航資料。未查核的 Google 評分請留白。</p></div><button id="newPlace" class="primary">新增地點</button></div><div class="filters" id="filters"></div><div class="place-grid" id="placeGrid"></div></section>
<section id="analyticsView" hidden><div class="toolbar"><div><h2>有效點擊分析</h2><p>已排除總部管理、操作人員、業務工作人員、測試 UID 與無法識別的匿名事件。</p></div><select id="period"><option value="7">7 天</option><option value="30" selected>30 天</option><option value="90">90 天</option><option value="365">365 天</option></select></div><div class="metrics" id="metrics"></div><div class="report-grid"><div><h3>互動類型</h3><table><thead><tr><th>事件</th><th>次數</th></tr></thead><tbody id="eventRows"></tbody></table></div><div><h3>熱門地點</h3><table><thead><tr><th>地點</th><th>互動</th></tr></thead><tbody id="placeRows"></tbody></table></div></div></section></main>
<dialog id="editor"><form method="dialog" id="placeForm"><header><h2 id="editorTitle">地點資料</h2><button value="cancel" aria-label="關閉">×</button></header><div class="form-grid"><input id="id" type="hidden"><label>分類<select id="category"></select></label><label>狀態<select id="status"><option value="active">上架</option><option value="disabled">下架</option></select></label><label class="wide">店家／景點名稱<input id="name" required></label><label>電話<input id="phone" inputmode="tel"></label><label>排序<input id="sortOrder" type="number" min="0"></label><label class="wide">地址<input id="address"></label><label class="wide">Google Maps 目的地文字<input id="destination" placeholder="店名 宜蘭縣礁溪鄉"></label><label class="wide">Google Place ID<input id="googlePlaceId"></label><label>緯度<input id="latitude" type="number" step="any"></label><label>經度<input id="longitude" type="number" step="any"></label><label>Google 評分<input id="rating" type="number" min="0" max="5" step="0.1"></label><label>評論數<input id="reviewCount" type="number" min="0"></label><label>評分查核日期<input id="ratingCheckedAt" type="date"></label><label>標籤<input id="tags" placeholder="步行,親子,雨天"></label><label class="wide">中性簡介<textarea id="summary"></textarea></label><label class="wide">既有圖片網址<input id="imageUrl" type="url"></label><label>圖片來源<input id="imageSource"></label><label>來源網址<input id="imageSourceUrl" type="url"></label><label class="wide upload">店家授權實景圖（上傳會裁成 16:9、最長 1200px）<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" alt="圖片預覽"></label></div><footer><span id="formStatus"></span><button value="cancel">取消</button><button id="deletePlace" type="button" class="danger">刪除</button><button id="submitPlace" type="submit" class="primary">儲存並同步前台</button></footer></form></dialog><div id="toast" role="status"></div></body></html>
