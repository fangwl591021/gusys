      {id:"about",label:"體驗介紹",icon:"🐟",items:[
        ["Q01","重口味溫泉魚是什麼？","「重口味」的名稱來自店家現場觀察：雙腳氣味較明顯時，魚群互動通常較集中，因此取名「重口味溫泉魚」。實際互動情況會因個人體質、飲食與作息等差異而不同；店家觀察多數男性較明顯、女性較少、兒童更少。"],
        ["Q03","你們有什麼特色？","現場有多種不同魚種與不同程度的互動感受，可以從比較弱的魚池開始，再慢慢挑戰更有感的魚池。"],
        ["Q04","第一次來可以玩嗎？","可以。第一次體驗可先從比較溫和的魚池開始，不知道怎麼選時也可以詢問現場工作人員。"],
        ["Q05","大人可以玩嗎？","可以，大人與小朋友都可以依現場規定選擇適合自己的魚池體驗。"],
        ["Q06","小朋友可以玩嗎？","可以。小朋友體驗時請由家長或同行成人陪同，並依現場安全規定使用。"],
        ["Q07","適合親子一起來嗎？","可以，是適合親子一起體驗的礁溪休閒活動之一。"],
        ["Q08","長輩可以體驗嗎？","可以，但建議依個人身體狀況自行評估，進出體驗區時也請特別留意地面與行走安全。"]
      ]},
      {id:"price",label:"收費入場",icon:"🎫",items:[

        ["Q12","幾歲以下免費？","4 歲以下免費。"],
        ["Q14","兒童票怎麼認定？","兒童票適用於 4 歲以上至國小六年級的兒童。"],
        ["Q15","假日會加價嗎？","假日依原價收費。"],
        ["Q16","平日跟假日價格一樣嗎？","不一樣，平日可能提供折扣，實際優惠以店家當日公告為準。"],
        ["Q19","可以不限時嗎？","當天不限體驗時間。"],
        ["Q20","出去之後還可以再進來嗎？","可以，當天蓋章後可重複進場。"],
        ["Q21","有團體票嗎？","有團體安排。團體來訪請先聯絡店家確認人數、時間與方案。"],
        ["Q24","可以用 LINE Pay 嗎？","目前沒有提供 LINE Pay。"],

        ["Q28","哪一池比較不刺激？","第一次體驗或比較怕癢的客人，可以先選沒有標示編號、互動感受最溫和的魚池。"],
        ["Q29","哪一池最有感？","每個人的敏感度不同，可依現場標示逐步嘗試；一般約 3 分鐘後會逐漸適應。"],
        ["Q30","我怕癢可以玩嗎？","可以，建議從比較溫和的魚池開始，慢慢適應。"],
        ["Q31","魚碰腳是什麼感覺？","每個人的感受不同，常見會覺得癢癢、酥麻或有明顯接觸感。"],
        ["Q32","會不會痛？","每個人的敏感程度不同。如果覺得不舒服，可以立即把腳移開，或改到其他比較適合自己的魚池。"],
        ["Q33","可以每一池都玩嗎？","依現場開放狀況與使用規定，可以體驗不同魚池。"],

      ]},
      {id:"traffic",label:"交通停車",icon:"📍",items:[
        ["Q35","你們在哪裡？","地址是宜蘭縣礁溪鄉仁愛路 23 號。"],
        ["Q37","在礁溪嗎？","是的，店家位於礁溪市區，鄰近湯圍溝一帶。"],
        ["Q38","離湯圍溝很遠嗎？","不遠，店家位於湯圍溝中間的三角窗位置，適合一起安排礁溪市區行程。"],
        ["Q39","從礁溪火車站可以走過去嗎？","可以，從礁溪火車站步行約 10 至 15 分鐘。"],

      {id:"hours",label:"營業衛生",icon:"🕘",items:[
        ["Q48","營業時間是幾點？","平日 09:00 至 22:00；假日 09:00 至 23:00。"],
        ["Q49","今天有營業嗎？","一般依正常營業時間營業。如遇臨時調整，請以 LINE 官方帳號或店家公告為準。"],
        ["Q53","過年有營業嗎？","全年無休；特殊期間如有調整，以店家最新公告為準。"],

        ["Q55","下雨天可以來嗎？","可以，仍請留意交通與地面濕滑狀況。"],
        ["Q56","體驗前需要洗腳嗎？","不用先洗腳，可以直接脫鞋襪入池體驗；但腳上若有沙子、泥土、乳液、藥膏或其他用品，必須先清洗乾淨。體驗結束離開前一定要洗腳。"],
        ["Q57","要脫鞋襪子嗎？","需要，請依現場指定位置脫鞋襪子後再進行體驗。"],
        ["Q59","腳有傷口可以玩嗎？","較大、開放性或持續滲血的傷口不得入池。一般已結痂、脫皮、蚊蟲咬傷紅點、輕微刮傷，或已用膠帶或敷料完整覆蓋的部位可以入池；如有疑慮請先詢問現場工作人員。糖尿病、洗腎或嚴重皮膚病者請勿入池。"],
        ["Q61","擦乳液可以直接下水嗎？","不可以，必須先把雙腳上的乳液清洗乾淨再入池。"],
        ["Q62","腳上有藥膏或其他用品可以入池嗎？","請先向現場工作人員確認，並依店內清潔規定處理後再體驗。"],
        ["Q64","有提供洗腳的地方嗎？","有提供洗腳區。體驗結束離開前，請務必把雙腳洗乾淨。"],
        ["Q66","毛巾要另外付費嗎？","每位來客贈送毛巾 1 條，不需另外付費。"],
        ["Q67","可以自己帶毛巾嗎？","可以自行準備個人毛巾。"]
      ]},
      {id:"safety",label:"安全規定",icon:"🛡️",items:[
        ["Q68","場地會不會濕滑？","魚池周邊可能會有水漬，請放慢腳步並留意地面狀況。"],
        ["Q69","場內可以跑嗎？","不可以。為避免滑倒或碰撞，體驗區請勿奔跑、追逐。"],
        ["Q70","小朋友可以自己跑來跑去嗎？","不建議，兒童請由家長或同行成人陪同並注意安全。"],
        ["Q71","小朋友需要大人陪同嗎？","需要，兒童體驗過程請由家長或成人陪同。"],

        ["Q74","可以在魚池裡走動或站立嗎？","不可以，請勿站立或走入魚池，以免發生危險或驚擾魚隻。"],

        ["Q76","可以抓魚嗎？","不可以，請勿抓取、追趕或將魚隻拿出水面，以免造成魚隻受傷或死亡。"],

        ["Q80","東西掉進魚池怎麼辦？","請不要自行進入魚池撿取，立即通知現場工作人員協助處理。"],
        ["Q81","手機可以帶到魚池旁嗎？","可以依現場規定使用，但請自行妥善保管，避免掉落或遺失。"],

        ["Q83","可以拍影片嗎？","可以，但請尊重其他客人的隱私，避免未經同意拍攝他人。"],
        ["Q84","飲料可以放池邊嗎？","不建議放在魚池邊緣，以免打翻、掉入水中或造成地面濕滑。"],
        ["Q85","可以在體驗區吃東西嗎？","請在現場指定區域飲食，並避免任何食物掉入魚池。"],
        ["Q86","鞋子要放哪裡？","請放在現場指定鞋區，勿放置在走道，以免形成通行障礙。"],

        ["Q92","可以帶寵物嗎？","可以，請依現場規定妥善管理。"],
        ["Q94","寵物可以靠近魚池嗎？","請依現場規定，並由飼主妥善管理寵物，避免影響其他客人與體驗區。"],
        ["Q95","寵物需要牽繩嗎？","需要，請全程使用牽繩或合適的寵物提具。"],
        ["Q96","可以帶嬰兒車嗎？","可以，請依現場動線放置及通行。"],
        ["Q97","輪椅方便進入嗎？","可以進入，但部分動線需特別留意，建議到場後請工作人員協助。"],
        ["Q98","可以帶行李箱嗎？","可以，但請依現場工作人員指示放置。"],
        ["Q99","可以帶外食嗎？","可以，請在指定區域食用，並避免食物掉入魚池。"],
        ["Q100","有集點或點數服務嗎？","目前重口味溫泉魚沒有提供集點或點數服務。若有其他優惠活動，請以 LINE 官方帳號最新公告為準。"]
      ]},
      {id:"service",label:"團體客服",icon:"☎️",items:[
        ["Q114","需要預約嗎？","一般入場目前不需要預約，可於營業時間直接到店。"],
        ["Q118","學校或公司團體可以來嗎？","可以。40 人以上團體需要提前預約，請先與店家聯絡確認人數、時間及相關安排。"],
        ["Q119","可以包場嗎？","可以。包場人數需超過 40 人；低於 120 人不提供折扣，包場時間以 1 小時內為原則。請事先聯絡店家確認。"],
        ["Q120","店家電話多少？","客服電話是 0985-197-664。"],
        ["Q121","可以用 LINE 問問題嗎？","可以，歡迎直接透過 LINE 官方帳號留言詢問。"],
        ["Q122","東西忘在店裡怎麼辦？","請盡快透過電話或 LINE 聯絡店家，提供遺失物品特徵及大約到店時間。確認尋獲後可協助寄回，相關費用與方式請洽客服。"],
        ["Q123","我要反映問題怎麼辦？","可以直接透過 LINE 官方帳號留言，或聯絡店家工作人員協助處理。"],
        ["Q124","想異業合作要找誰？","合作需求可透過 LINE 官方帳號或電話留下聯絡資料，由店家協助轉達。"]
      ]},
      {id:"nearby",label:"礁溪順遊",icon:"🗺️",items:[
        ["Q125","玩完附近還可以去哪？","店家位於礁溪市區、鄰近湯圍溝，可搭配礁溪市區散步、美食及其他景點安排。"],
        ["Q126","附近有景點嗎？","附近有湯圍溝溫泉公園及礁溪市區景點，可依當天行程安排。"],
        ["Q127","可以跟湯圍溝排在一起嗎？","可以，距離不遠，很適合安排在同一段礁溪行程。"],
        ["Q128","附近有什麼好吃的？","礁溪市區有許多餐廳、小吃與伴手禮店，可從 LINE 圖文選單的「礁溪順遊推薦」查看食、宿、遊、購、行資訊。"],
        ["Q129","下雨天附近還有什麼可以玩？","礁溪市區有不少室內或有遮蔽的休閒選擇，可以搭配溫泉魚體驗安排雨天行程。"],
        ["Q130","礁溪半日遊怎麼排？","可以安排重口味溫泉魚、湯圍溝、市區美食及其他鄰近景點，形成輕鬆的半日行程。"]
      ]}
    ];

    const state={category:"all",query:""};
    const tabs=document.getElementById("categoryTabs");
    const sectionsRoot=document.getElementById("faqSections");
    const searchInput=document.getElementById("searchInput");
    const clearSearch=document.getElementById("clearSearch");
    const resultCount=document.getElementById("resultCount");
    const emptyState=document.getElementById("emptyState");

    function normalize(value){return String(value||"").trim().toLocaleLowerCase("zh-Hant")}
    function make(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!=null)node.textContent=text;return node}
    function renderTabs(){
      tabs.replaceChildren();
      [{id:"all",label:"全部"},...FAQ_SECTIONS.map(section=>({id:section.id,label:section.label}))].forEach(item=>{
        const button=make("button","tab"+(state.category===item.id?" active":""),item.label);
        button.type="button";
        button.setAttribute("aria-pressed",state.category===item.id?"true":"false");
        button.addEventListener("click",()=>{state.category=item.id;render()});
        tabs.append(button);
      });
    }
    function matches(item){
      if(!state.query)return true;
      return normalize(item.join(" ")).includes(state.query);
    }
    function render(){
      renderTabs();
      sectionsRoot.replaceChildren();
      let total=0;
      FAQ_SECTIONS.forEach(section=>{
        if(state.category!=="all"&&state.category!==section.id)return;
        const items=section.items.filter(matches);
        if(!items.length)return;
        total+=items.length;
        const wrap=make("section","section");
        const head=make("div","section-head");
        head.append(make("span","section-icon",section.icon),make("h2","",section.label),make("span","section-count",`${items.length} 題`));
        const list=make("div","faq-list");
        items.forEach(item=>{
          const details=document.createElement("details");
          const summary=document.createElement("summary");
          summary.append(make("span","qid",item[0]),make("span","question",item[1]),make("span","chevron","＋"));
          details.append(summary,make("p","answer",item[2]));
          list.append(details);
        });
        wrap.append(head,list);
        sectionsRoot.append(wrap);
      });
      resultCount.replaceChildren(document.createTextNode("顯示 "),make("strong","",String(total)),document.createTextNode(" 個問題"));
      emptyState.hidden=total!==0;
      clearSearch.style.display=state.query?"block":"none";
    }
    searchInput.addEventListener("input",event=>{state.query=normalize(event.target.value);render()});
    clearSearch.addEventListener("click",()=>{searchInput.value="";state.query="";searchInput.focus();render()});
    document.getElementById("collapseAll").addEventListener("click",()=>document.querySelectorAll("details[open]").forEach(item=>item.open=false));
    render();
  </script>
</body>
</html>
